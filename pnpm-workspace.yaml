packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 no longer reads the `pnpm` field from package.json — overrides and
# onlyBuiltDependencies live here instead.
overrides:
  esbuild: 0.28.1
  # Security pins for dev/build-time transitive deps; none ship to the Worker runtime. The
  # HIGH-severity ones (ws, vite) keep CI `pnpm audit --audit-level=high` green; lower-severity
  # ones below are defense-in-depth, not required by that gate.
  #   ws <8.21.0  — memory-exhaustion DoS (GHSA-96hv-2xvq-fx4p), via wrangler→miniflare
  #   vite        — server.fs.deny bypass (GHSA-fx2h-pf6j-xcff): v7 via @react-router/dev→
  #                 vite-node, v8 via apps/web + vitest. Patched per-major to avoid forcing
  #                 vite-node (which needs v7) onto v8.
  #   undici <7.28.0 — three HIGH advisories via wrangler→miniflare: SOCKS5 TLS-cert bypass
  #                 (GHSA-vmh5-mc38-953g), WebSocket DoS via fragment-count bypass
  #                 (GHSA-vxpw-j846-p89q), cross-origin routing via SOCKS5 pool reuse
  #                 (GHSA-hm92-r4w5-c3mj). miniflare's local fetch only; never ships to the Worker.
  #   undici <7.29.0 — five further advisories disclosed against 7.28.0 (GHSA-4cwx-7wf7-3272 at
  #                 CVSS 7.4, plus GHSA-8xcm-r25x-g524, GHSA-jr45-8vmc-qm54, GHSA-m8rv-5g2x-5cg5,
  #                 GHSA-v3r7-h72x-cjcm), all fixed in 7.29.0. The range already admitted it; the
  #                 lockfile had simply not moved, so the audit gate went red on main.
  ws: '^8.21.0'
  vite@7: '^7.3.5'
  vite@8: '^8.0.16'
  undici: '^7.29.0'
  #   @babel/core <7.29.6 — arbitrary file read via sourceMappingURL (GHSA-4x5r-pxfx-6jf8);
  #                 dev/build-time only (via @react-router/dev), never ships to the Worker.
  '@babel/core': '^7.29.6'
  #   sharp <0.35.0 — inherited libvips CVEs (GHSA-f88m-g3jw-g9cj, HIGH), via wrangler→
  #                 miniflare (^0.34.5 cannot take 0.35.x on its own); local dev image handling
  #                 only, never ships to the Worker. Drop once miniflare bumps its range.
  sharp: '^0.35.3'
  #   postcss <8.5.18 — GHSA-r28c-9q8g-f849 (HIGH); dev/build-time only (via vite→vitest),
  #                 never ships to the Worker.
  postcss: '^8.5.18'
  #   valibot <1.4.2 — GHSA-5qjj-4xww-7phc (MEDIUM); transitive, build-time only, never
  #                 ships to the Worker.
  valibot: '^1.4.2'
  #   nanoid <3.3.17 — GHSA-2v37-7h3g-55p8 (HIGH, 8.2); pulled in by postcss (itself pinned
  #                 above), so postcss 8.5.24 keeps resolving 3.3.16 on its own. Build-time
  #                 only, via vite/vitest — never ships to the Worker.
  nanoid: '^3.3.17'

onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
