packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 no longer reads the `pnpm` field from package.json — overrides and
# onlyBuiltDependencies live here instead.
overrides:
  esbuild: 0.28.1
  # Security pins for dev/build-time transitive deps; none ship to the Worker runtime. The
  # HIGH-severity ones (ws, vite) keep CI `pnpm audit --audit-level=high` green; lower-severity
  # ones below are defense-in-depth, not required by that gate.
  #   ws <8.21.0  — memory-exhaustion DoS (GHSA-96hv-2xvq-fx4p), via wrangler→miniflare
  #   vite        — server.fs.deny bypass (GHSA-fx2h-pf6j-xcff): v7 via @react-router/dev→
  #                 vite-node, v8 via apps/web + vitest. Patched per-major to avoid forcing
  #                 vite-node (which needs v7) onto v8.
  #   undici <7.28.0 — three HIGH advisories via wrangler→miniflare: SOCKS5 TLS-cert bypass
  #                 (GHSA-vmh5-mc38-953g), WebSocket DoS via fragment-count bypass
  #                 (GHSA-vxpw-j846-p89q), cross-origin routing via SOCKS5 pool reuse
  #                 (GHSA-hm92-r4w5-c3mj). miniflare's local fetch only; never ships to the Worker.
  ws: '^8.21.0'
  vite@7: '^7.3.5'
  vite@8: '^8.0.16'
  undici: '^7.28.0'
  #   @babel/core <7.29.6 — arbitrary file read via sourceMappingURL (GHSA-4x5r-pxfx-6jf8);
  #                 dev/build-time only (via @react-router/dev), never ships to the Worker.
  '@babel/core': '^7.29.6'
  #   postcss <8.5.18 — path traversal via sourceMappingURL auto-load
  #                 (GHSA-r28c-9q8g-f849); patch-level fix.
  #   valibot <1.4.2  — flatten() crashes on inherited-property keys
  #                 (GHSA-5qjj-4xww-7phc); patch-level fix.
  postcss: '^8.5.18'
  valibot: '^1.4.2'
  #   react-router <7.18.0 — 4 advisories fixed within the 7.x line (no major bump needed):
  #                 SSR hydration constructor injection (GHSA-337j-9hxr-rhxg), unauthenticated
  #                 DoS via inefficient route matching (GHSA-chx6-hx7r-mcp5), RSCErrorHandler
  #                 missing protocol validation / XSS (GHSA-h8fp-f39c-q6mh), open redirect via
  #                 backslash in Link/useNavigate (GHSA-wrjc-x8rr-h8h6). The separate
  #                 GHSA-qwww-vcr4-c8h2 (RSC-only CSRF, needs 8.x) is NOT fixed by this pin —
  #                 see osv-scanner.toml for why that one is suppressed instead of bumped.
  'react-router': '^7.18.0'
  '@react-router/dev': '^7.18.0'

onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
