name = "sigma-etl"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Intentionally cron-only: NO public route, NO custom domain, NO HTTP trigger - this is a scheduled()-only Worker
# (workers_dev = false above).

# Bundle the scoped re-derive script (scripts/refresh-slice.sql) as a text module the Workflow runs.
# fallthrough keeps wrangler's default text rules (.txt/.html) active alongside this one.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[dev]
port = 8789

[vars]
EOP_OPEN_DATA_BASE_URL = "https://storage.eop.bg"
# The currently published Trade Register API used by the register layer (ADR-0041).
REGISTRY_API_BASE_URL = "https://api-sigma-cr.registryagency.bg"
REGISTRY_PORTAL_URL = "https://portal.registryagency.bg/CR/api/Applications/Entries"
# The declarations run in the Container below (ADR-0045); the weekly cron starts them. The container
# ships to the D1 these vars name — the renderer fills them per environment, like `database_name`.
DECLARATIONS_ENABLED = "true"
DECLARATIONS_BUCKET = "sigma-declarations"
SIGMA_D1_ID = "00000000-0000-0000-0000-000000000000"
SIGMA_D1_NAME = "sigma"
SIGMA_SHIP_ENV = "production"

# `database_id` is a zero-UUID placeholder for local dev (miniflare). `pnpm --filter @sigma/etl run
# deploy` substitutes SIGMA_D1_ID into wrangler.deploy.toml via scripts/wrangler-render.mjs.
[[d1_databases]]
binding = "DB"
database_name = "sigma"
database_id = "00000000-0000-0000-0000-000000000000"

# On-platform small-window data refresh. scheduled() kicks one durable Workflow run.
[[workflows]]
binding = "REFRESH"
name = "sigma-refresh"
class_name = "RefreshWorkflow"

[[workflows]]
binding = "REGISTRY"
name = "sigma-registry"
class_name = "RegistryWorkflow"

# An operator's declarations run (`wrangler workflows trigger`), waiting for the container's outcome.
[[workflows]]
binding = "DECLARATIONS_RUN"
name = "sigma-declarations"
class_name = "DeclarationsWorkflow"

# An operator's rebuild of the idle blue/green slot (ADR-0048), in the same container.
[[workflows]]
binding = "REBUILD_RUN"
name = "sigma-rebuild"
class_name = "RebuildWorkflow"

# The declarations job: one container per run, coordinated by its Durable Object, the corpus in R2.
[[containers]]
class_name = "DeclarationContainer"
image = "../../containers/declarations/Dockerfile"
image_build_context = "../.."
max_instances = 1
instance_type = { vcpu = 2, memory_mib = 6144, disk_mb = 12000 }

[[durable_objects.bindings]]
name = "DECLARATIONS"
class_name = "DeclarationContainer"

[[migrations]]
tag = "v1-declarations"
new_sqlite_classes = ["DeclarationContainer"]

[[r2_buckets]]
binding = "DECLARATIONS_CORPUS"
bucket_name = "sigma-declarations"

# Six-hourly: procurement and the register. Mondays 03:00 UTC: the declarations (DECLARATIONS_CRON).
[triggers]
crons = ["0 */6 * * *", "0 3 * * 1"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
