# OSV-Scanner suppression list, read automatically by the "Dependency audit" step in
# .github/workflows/ci.yml (`osv-scanner scan source -L pnpm-lock.yaml`).
#
# EVERY entry MUST document: which package + advisory, WHY it is safe to ignore (dev-only /
# not shipped), the version that FIXES it, and an `ignoreUntil` review date so the scanner
# re-flags it if we forget.
#
# AT EVERY MERGE / DEPENDENCY BUMP: re-check each entry. If the offending package has since
# been raised to (or past) its fixed version, DELETE the entry — do not let suppressions
# outlive the vulnerability they cover. `pnpm why <package>` shows the resolved version and
# what pulls it in.

# ── react-router 7.18.0 — GHSA-qwww-vcr4-c8h2 (High, CVSS 7.1), fixed in 8.3.0 ────────────
# WHY IGNORED: CSRF bypass in react-router's UNSTABLE RSC (React Server Components) code paths
# only. Sigma runs plain SSR (React Router v7) and uses NO unstable_/RSC APIs — see
# apps/web/react-router.config.ts (no unstable_ flags) and the note in workers/rate-limit.ts —
# so the vulnerable path is unreachable. The only fix is 8.3.0, a MAJOR upgrade requiring a
# planned migration (no 7.x backport exists as of the advisory).
# REMOVE WHEN: apps/web is migrated to react-router >= 8.3.0, or a 7.x patch ships.
[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2"
ignoreUntil = 2026-10-01T00:00:00Z
reason = "CSRF bypass in react-router unstable RSC APIs only; sigma uses plain SSR with no RSC/unstable_ usage, so unreachable. Fix is 8.3.0 (major). Remove on the react-router 8.x migration."

# ── sharp 0.34.5 (transitive, dev-only via miniflare) — libvips CVEs, fixed in 0.35.0 ──────
# WHY IGNORED: sharp 0.34.5 inherits libvips image-decoder CVEs (CVE-2026-33327/33328/
# 35590/35591). sharp is a TRANSITIVE, DEV-ONLY dependency of miniflare (local dev server /
# test runtime) — it is not part of the deployed Cloudflare Worker, and the vuln class needs
# decoding an untrusted image, which the dev toolchain does not do. No upstream fix is
# reachable: miniflare pins `sharp: ^0.34.5` (`>=0.34.5 <0.35.0`) and even its latest release
# still ships 0.34.5, so forcing 0.35.0 would require a pnpm override outside miniflare's
# declared range.
# REMOVE WHEN: miniflare adopts sharp >= 0.35.0 (tracked upstream); the ignoreUntil date
# resurfaces this if it lingers.
[[IgnoredVulns]]
id = "GHSA-f88m-g3jw-g9cj"
ignoreUntil = 2026-10-22T00:00:00Z
reason = "sharp<0.35.0 libvips CVEs — transitive dev-only dep (miniflare), not in the deployed Worker; no in-range upstream fix. Revisit when miniflare ships sharp>=0.35.0."
