name: Script unit tests

# Unit tests for the standalone helpers in scripts/ (ship-related-persons, emit-refresh-group, load-eop,
# check-docs, …) plus the свързани-лица CACBG pipeline. These are plain node:test files outside the
# workspace packages, so `pnpm test` (turbo) does not cover them — they run in their own workflow here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: scripts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # node:test only. related-persons-job.test.mjs runs the whole offline job, whose CACBG parser
      # imports fast-xml-parser (a workspace dep), so this job needs node_modules like the one below.
      # The other external dependency is the `sqlite3` binary, which ship-e2e.test.mjs drives as the
      # real target its fake wrangler writes into; it ships with the ubuntu-latest image, and the test
      # fails loudly (never skips) if it is ever absent.
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs

  # свързани-лица pipeline tests — the CACBG leg (parse/classify/load/audit/extract) and the
  # Търговски регистър leg (scripts/tr: registry facts, the evidence ladder, the decision pass,
  # the verdict cache). These use node:sqlite
  # (DatabaseSync) and import the shared companyNameKey .ts via the register-ts resolve hook, so they
  # need Node 24 (node:sqlite + native TS type-stripping, no experimental flag) — which is now the one
  # Node version everywhere (.node-version, engines, every workflow, the devcontainer), so the split
  # between the two jobs is about node_modules, not the runtime. The libel-critical resolution logic
  # gates merges here.
  cacbg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # parse.mjs imports fast-xml-parser (a workspace dep), so this job needs node_modules — unlike
      # the plain-node scripts above. Install before the scraper tests run.
      - run: pnpm install --frozen-lockfile
      # Both legs, or the glob silently excludes a whole module: scripts/tr/*.test.mjs matched NO job
      # until this line existed, so every test in it would have been decorative.
      - run: node --import ./scripts/cacbg/register-ts.mjs --test scripts/cacbg/*.test.mjs scripts/tr/*.test.mjs
