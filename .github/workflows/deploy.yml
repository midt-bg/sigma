name: Deploy (web + etl → Cloudflare)

# Production deploys originate here, not from a developer machine (see AGENTS.md / README.md): the
# scoped Cloudflare credential lives only in repo secrets. Ships the v1 set — the SSR explorer
# (`sigma`) and the refresh Workflow (`sigma-etl`). The remote D1 must already be provisioned and its
# real database_id set in the wrangler configs (see docs/deploy.md). Fails clearly without secrets.
#
# Event → target mapping (see the `detect` job):
#   - push to `main`     → staging      (continuous staging on every merge to main, so staging leads prod)
#   - version TAG (v*)   → production    (cut a release: git tag v1.0.1 && git push origin v1.0.1)
#   - workflow_dispatch  → the chosen environment
# midt-bg/sigma is the single repo carrying both the `staging` and `production` Environments (the former
# midt-bg/sigma-stage mirror was consolidated into it). Production is cut deliberately as a tag; staging
# tracks `main`. (To deploy on GitHub *Releases* instead of tags, swap the tag trigger for
# `release: { types: [published] }`.)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options:
          - staging
          - production
        default: staging
      component:
        # `rebuild-runner` deploys ONLY the Worker that rebuilds the idle slot for a release
        # (apps/etl/wrangler.rebuild-runner.toml, docs/runbooks/production-cutover.md): no schema, no web, no
        # ETL — the ETL of the previous release keeps refreshing the live slot until the switch.
        description: What to deploy
        type: choice
        options:
          - site
          - rebuild-runner
        default: site

# Least-privilege default token. The deploy job authenticates to Cloudflare with its own
# scoped API token (see the job `env:` below), never GITHUB_TOKEN — read is all CI needs.
permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        # Map the git event to a deploy target. Empty ("") => no deploy: the deploy job is skipped.
        #   workflow_dispatch  -> the chosen environment
        #   tag v*             -> production
        #   push to main       -> staging      (continuous staging — main always leads prod)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "env=" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.env != ''
    runs-on: ubuntu-latest
    # Explicit cap instead of the 360-min GitHub default: fail fast on a hung job (stalled network
    # I/O, wedged wrangler) rather than burn a 6-hour slot. Raised from 10 for the declarations
    # container (ADR-0045): its image is built here — base image, a full install inside it, a push to
    # Cloudflare's registry — on top of the schema steps and both Workers, which alone ran in
    # single-digit minutes. The required-reviewers wait on `production` does NOT count against this;
    # the timer starts only once the job hits a runner.
    timeout-minutes: 30
    environment: ${{ needs.detect.outputs.env }}
    concurrency:
      group: deploy-${{ needs.detect.outputs.env }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Real D1 database_id substituted into wrangler.deploy.* by scripts/wrangler-render.mjs
      # (committed wrangler.* hold a zero-UUID dummy). See docs/deploy.md.
      SIGMA_D1_ID: ${{ secrets.SIGMA_D1_ID }}
      SIGMA_WEB_NAME: ${{ vars.SIGMA_WEB_NAME }}
      SIGMA_ETL_NAME: ${{ vars.SIGMA_ETL_NAME }}
      SIGMA_WORKFLOW_NAME: ${{ vars.SIGMA_WORKFLOW_NAME }}
      SIGMA_REGISTRY_WORKFLOW_NAME: ${{ vars.SIGMA_REGISTRY_WORKFLOW_NAME }}
      SIGMA_DECLARATIONS_WORKFLOW_NAME: ${{ vars.SIGMA_DECLARATIONS_WORKFLOW_NAME }}
      SIGMA_REBUILD_WORKFLOW_NAME: ${{ vars.SIGMA_REBUILD_WORKFLOW_NAME }}
      SIGMA_DECLARATIONS_BUCKET: ${{ vars.SIGMA_DECLARATIONS_BUCKET }}
      # The environment the declarations container declares when it ships (assertD1TargetAuthorized).
      SIGMA_SHIP_ENV: ${{ needs.detect.outputs.env }}
      # The container's takedown-list keying (ADR-0031), handed to the ETL Worker as secrets below.
      SUPPRESSION_SALT: ${{ secrets.SUPPRESSION_SALT }}
      SUPPRESSION_KEY_VERSION: ${{ vars.SUPPRESSION_KEY_VERSION || '1' }}
      SIGMA_D1_NAME: ${{ vars.SIGMA_D1_NAME }}
      SIGMA_CSV_CACHE_NAME: ${{ vars.SIGMA_CSV_CACHE_NAME }}
      SIGMA_REPORTS_NAME: ${{ vars.SIGMA_REPORTS_NAME }}
      SIGMA_VECTORIZE_NAME: ${{ vars.SIGMA_VECTORIZE_NAME }}
      SIGMA_COMPONENT: ${{ inputs.component || 'site' }}
      SIGMA_REBUILD_RUNNER_NAME: ${{ vars.SIGMA_REBUILD_RUNNER_NAME }}
      SIGMA_REBUILD_CUTOVER_WORKFLOW_NAME: ${{ vars.SIGMA_REBUILD_CUTOVER_WORKFLOW_NAME }}
      # The commit this deploy ships; a rebuild records it beside the data version it writes.
      SIGMA_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Guard — require deploy credentials
        id: guard
        run: |
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "${SIGMA_D1_ID}" ]          && missing+=("SIGMA_D1_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]} — cannot deploy."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Non-prod deploys must use distinct resource names. An unset name var renders the PRODUCTION
      # default (so a misconfigured staging run would overwrite the live `sigma` worker) — fail loudly
      # instead. Skipped for production, which is meant to use the committed defaults. See docs/deploy.md.
      - name: Guard — non-prod must not reuse production resource names
        if: needs.detect.outputs.env != 'production'
        run: |
          fail=0
          check() {  # $1=value  $2=prod default  $3=var name
            if [ -z "$1" ] || [ "$1" = "$2" ]; then
              echo "::error::$3 must be a non-production value for env '${{ needs.detect.outputs.env }}' (got '${1:-<empty>}', prod default '$2') — set it as a GitHub Environment *variable*."
              fail=1
            fi
          }
          check "$SIGMA_WEB_NAME"       sigma           SIGMA_WEB_NAME
          check "$SIGMA_ETL_NAME"       sigma-etl       SIGMA_ETL_NAME
          check "$SIGMA_WORKFLOW_NAME"  sigma-refresh   SIGMA_WORKFLOW_NAME
          check "$SIGMA_REGISTRY_WORKFLOW_NAME" sigma-registry SIGMA_REGISTRY_WORKFLOW_NAME
          check "$SIGMA_DECLARATIONS_WORKFLOW_NAME" sigma-declarations SIGMA_DECLARATIONS_WORKFLOW_NAME
          check "$SIGMA_REBUILD_WORKFLOW_NAME" sigma-rebuild SIGMA_REBUILD_WORKFLOW_NAME
          check "$SIGMA_DECLARATIONS_BUCKET" sigma-declarations SIGMA_DECLARATIONS_BUCKET
          check "$SIGMA_D1_NAME"        sigma           SIGMA_D1_NAME
          check "$SIGMA_CSV_CACHE_NAME" sigma-csv-cache SIGMA_CSV_CACHE_NAME
          check "$SIGMA_REPORTS_NAME"   sigma-reports   SIGMA_REPORTS_NAME
          check "$SIGMA_VECTORIZE_NAME" sigma-assistant SIGMA_VECTORIZE_NAME
          if [ "$SIGMA_COMPONENT" = rebuild-runner ]; then
            check "$SIGMA_REBUILD_RUNNER_NAME" sigma-rebuild-runner SIGMA_REBUILD_RUNNER_NAME
            check "$SIGMA_REBUILD_CUTOVER_WORKFLOW_NAME" sigma-rebuild-cutover SIGMA_REBUILD_CUTOVER_WORKFLOW_NAME
          fi
          [ "$fail" = 0 ] || { echo "Refusing to deploy '${{ needs.detect.outputs.env }}' with production resource names."; exit 1; }

      - name: Typecheck
        if: steps.guard.outputs.ok == 'true'
        run: pnpm typecheck

      # Before anything is written: the environment's settings and the slot they name (scripts/deploy-preflight.mjs,
      # docs/deploy.md „Проверка преди запис“). The database name and id must resolve to each other and name
      # one of the environment's slots; production also needs the takedown salt and a slot whose rows were
      # built by this code's rules (packages/db/data-version.json) — rows built by other rules are rebuilt
      # in the idle slot and switched to, never released over in place. Read only.
      - name: Preflight — environment settings and target slot
        if: steps.guard.outputs.ok == 'true'
        run: |
          node scripts/wrangler-render.mjs apps/web/wrangler.jsonc
          node scripts/deploy-preflight.mjs "${{ needs.detect.outputs.env }}" --component "$SIGMA_COMPONENT"

      # Schema before serving, through wrangler's migration ledger and nothing else (scripts/release-schema.mjs,
      # docs/deploy.md „Схемата“). The plan only reads: it compares the target's ledger and schema with the
      # migration chain, and refuses a half-applied file or a schema that differs from what the chain builds.
      # Apply takes a Time Travel restore point, records as applied the migrations whose objects the target
      # already holds (a database shaped by the old hand-kept steps), applies the rest in order and checks
      # parity again. A failure stops the deploy before the Workers, so the target keeps serving the code
      # it was built for. Nothing here re-runs precompute.sql or rewrites rows: a change to the computation
      # rules is a slot rebuild and a switch (docs/deploy.md), not a step on the served database.
      - name: Schema plan
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'site'
        run: |
          node scripts/wrangler-render.mjs apps/web/wrangler.jsonc
          # prod leaves SIGMA_D1_NAME unset and uses the committed 'sigma' default (as wrangler-render does).
          node scripts/release-schema.mjs plan "${SIGMA_D1_NAME:-sigma}"

      - name: Schema apply
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'site'
        run: node scripts/release-schema.mjs apply "${SIGMA_D1_NAME:-sigma}" --remote --yes

      # A one-time currency backfill that earlier staging deploys ran once mapped annex_total_suspect to the
      # doubled current value (fixed in backfill-current-value-currency.sql); rows the refresh has not
      # re-valued since still sum it. The repair writes their signing-based amount and queues them in the
      # refresh's touched sets, so the next refresh rebuilds every rollup they feed; a second run changes
      # nothing. Staging only:
      # production never ran that backfill, and the integrity gate now asserts the rule everywhere.
      - name: Repair amounts of doubled annex totals (staging)
        if: steps.guard.outputs.ok == 'true' && needs.detect.outputs.env != 'production' && env.SIGMA_COMPONENT == 'site'
        run: |
          node scripts/wrangler-render.mjs apps/web/wrangler.jsonc
          bash scripts/d1-file.sh "${SIGMA_D1_NAME:-sigma}" ../../scripts/repair-annex-total-suspect.sql

      # The curated list of state public enterprises (scripts/seed-state-owned.sql, ADR-0047) is data that
      # ships with the code, yet only a full import or a slot rebuild ever applied it — a served database kept
      # the list it was built with. The file replaces the list whole (DELETE + INSERT, one import). The next
      # refresh re-derives every winner's ownership from it, the next registry run the companies held through
      # it, and the next declarations run its day-job correction.
      - name: Sync the curated public-ownership list
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'site'
        run: |
          node scripts/wrangler-render.mjs apps/web/wrangler.jsonc
          bash scripts/d1-file.sh "${SIGMA_D1_NAME:-sigma}" ../../scripts/seed-state-owned.sql

      # `run deploy`, not `deploy` — bare `pnpm deploy` is a pnpm built-in, not our package script.
      - name: Deploy explorer (sigma)
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'site'
        run: pnpm --filter @sigma/web run deploy

      - name: Initialize LOG_IP_KEY secret if absent
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'site'
        run: |
          # LOG_IP_KEY is long-lived so IP HMAC tokens remain stable for same-client correlation.
          # SIGMA_WEB_NAME is unset in production (the committed default `sigma`); a bare "$SIGMA_WEB_NAME"
          # listed the secrets of no Worker, so production never received a key.
          # Never overwrite it; a new blue-green worker name starts without a key and correlation
          # resets at full infra cutover, which is acceptable. The deploy token already has
          # Workers Scripts:Edit, so no separate Cloudflare token is required.
          if ! secrets_json="$(pnpm --filter @sigma/web exec wrangler secret list --name "${SIGMA_WEB_NAME:-sigma}" --format json)"; then
            echo "Skipping LOG_IP_KEY initialization: failed to list secrets for ${SIGMA_WEB_NAME:-sigma}."
            exit 0
          fi

          set +e
          printf '%s' "$secrets_json" | node -e '
            const fs = require("fs");
            let secrets;
            try {
              secrets = JSON.parse(fs.readFileSync(0, "utf8"));
            } catch {
              process.exit(2);
            }
            if (!Array.isArray(secrets)) {
              process.exit(2);
            }
            process.exit(secrets.some((secret) => secret && secret.name === "LOG_IP_KEY") ? 0 : 1);
          '
          secret_status="$?"
          set -e

          if [ "$secret_status" = 0 ]; then
            echo "LOG_IP_KEY already exists for ${SIGMA_WEB_NAME:-sigma}; leaving it unchanged."
            exit 0
          fi
          if [ "$secret_status" != 1 ]; then
            echo "Skipping LOG_IP_KEY initialization: unexpected secret list output for ${SIGMA_WEB_NAME:-sigma}."
            exit 0
          fi

          key="$(openssl rand -hex 32)"
          # Register the value as a secret with the runner BEFORE it is used anywhere else, so an
          # accidental echo / set -x trace in a later edit can never leak it. Masking is not
          # retroactive within a line, hence add-mask on the line right after generation.
          echo "::add-mask::$key"
          printf '%s' "$key" | pnpm --filter @sigma/web exec wrangler secret put LOG_IP_KEY --name "${SIGMA_WEB_NAME:-sigma}"

      - name: Deploy refresh Workflow (sigma-etl)
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'site'
        run: pnpm --filter @sigma/etl run deploy

      # The declarations container ships to D1 with the same scoped token this job deploys with, and keys
      # the takedown list with the same salt. `secret put` overwrites, so a rotated value lands on the next
      # deploy. SIGMA_ETL_NAME is unset in production (the committed default).
      - name: ETL Worker secrets for the declarations container
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'site'
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPPRESSION_SALT SUPPRESSION_KEY_VERSION; do
            value="${!name}"
            [ -n "$value" ] || { echo "$name is empty; leaving the Worker secret unchanged."; continue; }
            printf '%s' "$value" | pnpm --filter @sigma/etl exec wrangler secret put "$name" --config wrangler.deploy.toml
          done

      # The rebuild runner (component: rebuild-runner) — the Worker that rebuilds the idle slot for a release
      # while the previous release keeps serving (docs/runbooks/production-cutover.md). Same code and container
      # as the ETL, one Workflow under a name of its own, no Cron Triggers, no D1 binding. Its bucket may not
      # exist yet in an environment whose ETL predates the declarations; it is created, never emptied.
      - name: Rebuild runner — declarations bucket
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'rebuild-runner'
        run: |
          bucket="${SIGMA_DECLARATIONS_BUCKET:-sigma-declarations}"
          if pnpm --filter @sigma/etl exec wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
            echo "$bucket exists"
          else
            pnpm --filter @sigma/etl exec wrangler r2 bucket create "$bucket"
          fi

      - name: Deploy the rebuild runner
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'rebuild-runner'
        run: |
          SIGMA_ETL_NAME="${SIGMA_REBUILD_RUNNER_NAME:-sigma-rebuild-runner}" \
          SIGMA_REBUILD_WORKFLOW_NAME="${SIGMA_REBUILD_CUTOVER_WORKFLOW_NAME:-sigma-rebuild-cutover}" \
            node scripts/wrangler-render.mjs apps/etl/wrangler.rebuild-runner.toml
          pnpm --filter @sigma/etl exec wrangler deploy --config wrangler.deploy.rebuild-runner.toml

      - name: Rebuild runner secrets
        if: steps.guard.outputs.ok == 'true' && env.SIGMA_COMPONENT == 'rebuild-runner'
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPPRESSION_SALT SUPPRESSION_KEY_VERSION; do
            value="${!name}"
            [ -n "$value" ] || { echo "$name is empty; leaving the Worker secret unchanged."; continue; }
            printf '%s' "$value" | pnpm --filter @sigma/etl exec wrangler secret put "$name" \
              --config wrangler.deploy.rebuild-runner.toml
          done

      # The declarations run's checkpoints and fetch events are read by nothing once it is over; without
      # expiry rules they stay for good, and the rules existed only where someone had set them by hand.
      - name: Expire the declarations run's leftovers in R2
        if: steps.guard.outputs.ok == 'true'
        run: bash scripts/ensure-r2-lifecycle.sh "${SIGMA_DECLARATIONS_BUCKET:-sigma-declarations}"
