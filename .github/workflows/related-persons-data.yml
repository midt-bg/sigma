name: Related-persons data foundation (build + ship)

# Deliberate, manual (re)build of the свързани-лица data foundation and ship into a served D1.
#
# This is the heavy backfill/rebuild path — NOT the steady-state refresh. Per spec §7, ongoing
# incremental refresh (pull only the current-year delta) runs inside the Cloudflare `sigma-etl` Worker
# on a cron, the same operational model as the EOP ingest — deploy.yml ships that Worker. This workflow
# exists to (re)seed D1 after a schema change, a methodology change, or a first backfill, from a chosen
# environment, on demand only. It never runs on push (data writes are deliberate — see ci-vs-cd).
#
# Requires the same Cloudflare credentials as deploy.yml, scoped in the GitHub Environment (secret NAMES,
# never values): CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID + SIGMA_D1_ID, and the SIGMA_D1_NAME var.
# Fails loudly if they are absent.  # pragma: allowlist secret The full crawl of register.cacbg.bg is slow (a polite crawl of the
# whole corpus); in steady state the raw XML lives in R2 (ADR-0006) so the crawl is incremental — the
# `sigma-etl` Worker owns that. Here `full_crawl` runs the corpus crawl, which RESUMES from the cached raw
# XML (fetch.mjs skips files already on disk) — it fills gaps, not a from-scratch rebuild unless the cache is cleared.

on:
  # SCHEDULED, and deliberately on the EXISTING workflow rather than a second one. #279 §9 asks for the
  # publishing decisions to run on a cadence; duplicating the job would create a second ship path with
  # its own copy of the credential guards, the D1-target guard and the ship floor — and the copy is the
  # one nobody exercises.
  #
  # WHY WEEKLY, AND WHY THAT IS NOT MORE TRAFFIC. ADR-0034 set this monthly on the reasoning that the
  # raw deeds cannot survive a runner — they carry the names and addresses of co-owners and managers
  # with no public office, and an Actions cache entry lives under a restore-keys chain where ADR-0033
  # decision 5's retention cannot reach it — so every run that decided also had to crawl, and a daily
  # decision meant ~400 daily requests against somebody else's register.
  #
  # ADR-0037 removed the premise: the crawl now emits per-(link, ЕИК) verdicts, so booleans cross the
  # boundary and no name has to. What forced weekly is arithmetic, not preference. A link comes due
  # once its verdict passes --max-age-days, so the register sees each company about once a month at any
  # cadence — the cadence decides only how the work is BUNCHED. Monthly, everything expired at once and
  # one run's budget covered barely half of it, for ever. Weekly spreads the same total across four
  # runs, each comfortably inside its budget. Fewer requests are never on the table; finishing is.
  #
  # A daily decision remains a separate choice with its own cost, and is deliberately not taken here.
  #
  # A scheduled run takes the same path as a manual one, with two differences:
  #   • it targets STAGING (the environment default below). Production stays manual, so the
  #     assertD1TargetAuthorized guard keeps a prod write a deliberate act.
  #   • `full_crawl` is empty and therefore false, so it never crawls the CACBG corpus — it re-runs the
  #     decisions over the cached corpus, which is exactly what #279 §9 means by a pure, zero-network
  #     decision. Registry lookups are the one exception and run from inside this job on the 1st of the
  #     month (see „Decide whether to hit the register"): they cannot be a separate workflow, because the
  #     raw deeds they fetch carry third-party names and must not be persisted between runners.
  # If the corpus cache has been evicted, extract yields nothing, the ship floor refuses, and the run
  # fails loudly rather than wiping the surface.
  schedule:
    # 03:00 UTC on Mondays. See the note above: the decision and the crawl are one pass, so the decision
    # cadence is the crawl cadence — and weekly is what makes that cadence able to finish.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: Target D1 environment
        type: choice
        # No `dev` environment exists — every fallback in this file is `|| 'staging'` and the note above
        # says the job targets staging. A `dev` default sent a manual dispatch to an environment with no
        # secrets, so it failed at the credential guard rather than running where it was meant to.
        options: [staging, production]
        default: staging
      full_crawl:
        description: Crawl the CACBG corpus (slow). RESUMES from the cached raw XML — fetch.mjs skips files already on disk, so this fills gaps rather than re-fetching from scratch (clear the cache for a true rebuild). Off = extract from the existing raw cache without crawling.
        type: boolean
        default: false
      tr_max_age_days:
        description: Re-decide links whose registry lookup is older than this many days (default 30). Use a large value to force a full refresh.
        type: string
        default: '30'
      tr_max_runtime_min:
        description: Wall-clock ceiling for the register crawl (default 180). Spending it stops the crawl cleanly; the next run resumes from the cached verdicts.
        type: string
        default: '180'
      tr_limit:
        description: Stop after this many registry lookups (blank = all pending). Bound a first run while watching for a 429.
        type: string
        default: ''

# Least-privilege: this workflow only reads the repo; it authenticates to Cloudflare with a scoped token.
permissions:
  contents: read

concurrency:
  # Never let two data-foundation runs overlap, and deliberately NOT keyed on the environment. Two
  # writes to different D1 slots cannot collide, but both crawl the SAME public register — a staging
  # and a production run in parallel would double the effective request rate against it, which at the
  # measured 5-per-window limiter (ADR-0036) is both rude and self-defeating. The shared resource is
  # the register, so the group is global. Never cancel one in flight: a killed run loses whatever the
  # crawl had not yet committed.
  group: related-persons-data
  cancel-in-progress: false

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    # A from-scratch corpus crawl of the whole register is the long pole (all year-folders, politely
    # throttled) and must fit in ONE job with the registry lookups, extract/resolve/audit/ship after it —
    # 120 was too tight and timed out mid-crawl. The Търговски регистър pass is bounded separately by
    # --max-runtime-min (180 by default, set on its step) rather than by request count: the register's
    # limiter allows ~5 lookups per ~195s cooldown cycle (ADR-0036), so it is wall-clock that governs,
    # not the ~400 candidates. 300 leaves headroom under GitHub's 6-hour hard cap. A run past this is wedged
    # (stalled gov-server I/O) — fail rather than burn the slot. The raw corpus is cached (below) so a
    # re-run resumes instead of re-crawling from scratch.
    timeout-minutes: 300
    environment: ${{ inputs.environment || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGMA_D1_ID: ${{ secrets.SIGMA_D1_ID }}
      SIGMA_D1_NAME: ${{ vars.SIGMA_D1_NAME }}
      # The DECLARED intended environment — the independent anchor the ship guard checks the (name, id) pair
      # against (T48), so a consistent-but-wrong pair can't wipe the wrong DB. See assertD1TargetAuthorized.
      SIGMA_SHIP_ENV: ${{ inputs.environment || 'staging' }}
      # Suppression (takedown) list keying — load.mjs fingerprints link-suppressions.jsonl under this salt and
      # refuses to build if the list is non-empty but the salt is unset (fail-closed, ADR-0031). Without this
      # the first suppression entry would break every ship; the key version guards a coordinated salt rotation.
      SUPPRESSION_SALT: ${{ secrets.SUPPRESSION_SALT }}
      SUPPRESSION_KEY_VERSION: ${{ vars.SUPPRESSION_KEY_VERSION || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # node:sqlite (DatabaseSync) + native TS type-stripping, no flags
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Guard — require Cloudflare credentials
        run: |
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "${SIGMA_D1_ID}" ]          && missing+=("SIGMA_D1_ID")
          [ -z "${SIGMA_D1_NAME}" ]        && missing+=("SIGMA_D1_NAME (var)")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repo/environment secrets: ${missing[*]} — cannot ship."
            exit 1
          fi

      # Positive name allowlist by environment (allowlist-over-denylist, ADR-0031). This workflow wipes+reloads
      # the свързани-лица tables, so a wrong target is destructive: production MUST name a prod blue-green slot
      # (sigma-blue|sigma-green — deploy.md „production" row), and dev/staging MUST NOT. (The exact non-prod names
      # live in each Environment's SIGMA_D1_NAME var; the ship step additionally requires SIGMA_SHIP_ENV to match
      # and PROVES the name↔SIGMA_D1_ID pair against Cloudflare before deleting — assertD1TargetAuthorized.)
      # The slot set is kept in lockstep with PRODUCTION_SLOTS in scripts/ship-related-persons.mjs (#226).
      # $SIGMA_SHIP_ENV, never `${{ inputs.environment }}` inline. `type: choice` is enforced by the UI
      # only — a POST to .../dispatches can pass an arbitrary string, which an inline expression pastes
      # into the shell before `[` ever evaluates it. This block is also the one that decides whether the
      # production guard fires, so a crafted value could both inject and walk past the guard it was
      # meant to trip. The env binding above passes the same value as data, where it cannot be code.
      - name: Guard — SIGMA_D1_NAME matches the environment
        run: |
          case "${SIGMA_D1_NAME}" in
            sigma-blue|sigma-green) IS_PROD_SLOT=1 ;;
            *) IS_PROD_SLOT=0 ;;
          esac
          if [ "${SIGMA_SHIP_ENV}" = "production" ]; then
            if [ "$IS_PROD_SLOT" != "1" ]; then
              echo "::error::production requires SIGMA_D1_NAME to be a prod slot (sigma-blue|sigma-green), got '${SIGMA_D1_NAME}' — refusing to ship."
              exit 1
            fi
          else
            if [ "$IS_PROD_SLOT" = "1" ]; then
              echo "::error::SIGMA_D1_NAME='${SIGMA_D1_NAME}' (a PRODUCTION slot) on a '${SIGMA_SHIP_ENV}' run — a rebuild would WIPE prod. Set a non-production SIGMA_D1_NAME variable for this Environment."
              exit 1
            fi
          fi

      # Persist the raw XML corpus across runs. fetch.mjs writes to scratch/cacbg/raw/ and skips files
      # already on disk (source is immutable per year), so restoring a prior snapshot lets a re-run resume
      # instead of re-crawling from 2015 — and makes full_crawl=false ("extract from existing raw cache")
      # meaningful. Each run saves under a unique key; restore-keys pulls the most recent snapshot.
      # (Cross-run only — durable incremental persistence is the sigma-etl Worker's R2 job per ADR-0006.
      # GitHub's 10 GB repo cache is the ceiling here.)
      #
      # The key carries run_attempt, not just run_id, because run_id is STABLE across a re-run — that is what
      # run_attempt exists for — and a cache entry is immutable once written. Keyed on run_id alone, „Re-run
      # failed jobs" (the natural response to a deadline stop, and what this file's own comments invite)
      # restores attempt 1's snapshot, crawls for hours, then tries to save onto attempt 1's key: refused,
      # downgraded to a warning, step green. The verify step below would then look up that same key, find
      # attempt 1's entry, and certify the loss as a success. Every extra hour crawled would vanish.
      - name: Restore raw CACBG corpus cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/cacbg/raw
          key: cacbg-raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cacbg-raw-

      # Crawl only on demand. The polite full crawl of register.cacbg.bg is long; steady-state refresh
      # (incremental, R2-cached) is the sigma-etl Worker's job (spec §7), not this workflow.
      #
      # --deadline-minutes is 60 under the job's 300-minute cap, and the margin is the point. The corpus
      # (~37 sets / ~281 000 declarations) does not fit in one job: run 31889519937 crawled 36 sets in the
      # full 300 and was killed inside the 37th. A killed crawl keeps writing after the step dies, so the
      # `always()` save below ran tar over a moving tree, failed with „file changed as we read it", and —
      # because actions/cache/save downgrades a save failure to a warning — reported success having stored
      # nothing. Stopping ourselves at 240 leaves the tree quiet before the axe falls.
      #
      # The margin is 60 minutes MINUS what the deadline cannot see. fetch.mjs starts its own clock when it
      # starts, so checkout, pnpm/Node setup, install, the guards and the cache restore all come out of the
      # 300 before minute 0; the stop itself can overshoot by one politeGet chain (5 tries × a 30 s
      # inactivity timeout plus backoff, concurrent across workers, so ~3 min not 8×3); and on a run that
      # does NOT deadline, everything downstream — extract over ~281k files, the D1 export, the ~20-minute
      # Trade Register pass, resolve, audit, migrations, ship, reindex — has to fit in the same hour. Tar
      # itself is the least of it (~3 GB in an hour is under 1 MiB/s). Treat 60 as adequate but not roomy:
      # if the downstream steps grow, lower the deadline rather than raising the cap.
      #
      # The crawl exits non-zero on a deadline stop (the corpus IS partial) and the cache carries what it
      # fetched, so the next run resumes rather than restarting. Budget two runs for a cold corpus, one
      # thereafter. Either „Re-run failed jobs" or a fresh dispatch resumes: the key carries run_attempt,
      # which a re-run increments, so the save lands on a new key while restore-keys still finds the old one.
      - name: Crawl CACBG (full corpus)
        if: ${{ inputs.full_crawl }}
        run: node scripts/cacbg/fetch.mjs --concurrency 8 --deadline-minutes 240

      # Save the (possibly extended) corpus whenever we crawled — even if a later step fails — so the next
      # run resumes from here. Skipped on full_crawl=false runs (nothing new was fetched).
      - name: Save raw CACBG corpus cache
        if: ${{ always() && inputs.full_crawl }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/cacbg/raw
          key: cacbg-raw-${{ github.run_id }}-${{ github.run_attempt }}

      # The step above CANNOT fail: actions/cache/save turns any upload/tar error into a warning and exits 0,
      # so a green „Save raw CACBG corpus cache" is not evidence that anything was stored — in run
      # 31889519937 it was green and the cache was empty, which is how five hours of crawling went missing
      # unnoticed. Ask the cache service whether the key actually exists; lookup-only downloads nothing.
      - name: Verify the corpus cache was really written
        if: ${{ always() && inputs.full_crawl }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/cacbg/raw
          key: cacbg-raw-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Extract declarations → staging (dedup by ControlHash)
        run: node scripts/cacbg/extract.mjs

      # Provision the EOP winners the resolver matches against. load.mjs reads bidders + contracts/tenders/
      # authorities from a local work DB (data/work/backfill.sqlite); CI has none. Export EXACTLY those four
      # tables from the target D1 into a fresh work DB. This is READ-ONLY on the D1 and cannot mutate it;
      # the only writer to the D1 in this pipeline is the ship step, whose table list is свързани-лица only
      # (bidders/contracts/tenders/authorities are never written) — so the live EOP corpus is never touched.
      # Parity gate: exported row counts must equal the source counts, else the export was partial → fail
      # BEFORE the resolver runs, rather than resolve/ship against an incomplete winner set.
      - name: Hydrate EOP winners into the work DB (read-only export from D1)
        run: |
          set -euo pipefail
          node scripts/wrangler-render.mjs apps/web/wrangler.jsonc
          work="$GITHUB_WORKSPACE/data/work"
          mkdir -p "$work"
          rm -f "$work/eop.sql" "$work/backfill.sqlite"
          # interest_links + interest_link_evidence come along too, and NOT for the resolver's benefit —
          # load.mjs drops and rebuilds them. They are the input to the monotonicity gate: load.mjs
          # exports the currently-published set BEFORE the wipe, and audit.mjs fails the run on a link
          # that was published last time, under an unchanged rules_version, and is not published now.
          # Without them the work DB starts with no interest_links at all, the pre-wipe export reads
          # „no such table", the snapshot is [] on every run, and the gate protects nothing.
          # They are absent on a first run (0003/0006 not yet applied), which is why they are exported
          # separately and tolerated as missing rather than folded into the parity loop below.
          pnpm --filter @sigma/web exec wrangler d1 export "$SIGMA_D1_NAME" \
            --config wrangler.deploy.jsonc --remote -y \
            --table bidders --table contracts --table tenders --table authorities \
            --output "$work/eop.sql"
          sqlite3 "$work/backfill.sqlite" < "$work/eop.sql"
          if pnpm --filter @sigma/web exec wrangler d1 export "$SIGMA_D1_NAME" \
               --config wrangler.deploy.jsonc --remote -y \
               --table interest_links --table interest_link_evidence \
               --output "$work/prior-links.sql"; then
            sqlite3 "$work/backfill.sqlite" < "$work/prior-links.sql"
            echo "  prior surface: $(sqlite3 "$work/backfill.sqlite" \
              "SELECT COUNT(*) FROM interest_links WHERE status='published';") published link(s)"
          else
            echo "::notice::No prior interest_links on this D1 (first run) — the monotonicity gate has no baseline yet."
          fi
          for t in bidders contracts tenders authorities; do
            local_n=$(sqlite3 "$work/backfill.sqlite" "SELECT COUNT(*) FROM $t;")
            remote_json=$(pnpm --filter @sigma/web exec wrangler d1 execute "$SIGMA_D1_NAME" \
              --config wrangler.deploy.jsonc --remote --json \
              --command "SELECT COUNT(*) AS n FROM $t;")
            remote_n=$(printf '%s' "$remote_json" | python3 -c "import json,re,sys; m=re.search(r'\[.*\]', sys.stdin.read(), re.S); print(json.loads(m.group(0))[0]['results'][0]['n'])")
            echo "  $t: local=$local_n remote=$remote_n"
            if [ "$local_n" != "$remote_n" ]; then
              echo "::error::EOP export incomplete for $t (local=$local_n remote=$remote_n) — refusing to resolve/ship."
              exit 1
            fi
          done

      # ── Trade Register lookups ────────────────────────────────────────────────────────────────────
      # In THIS job, deliberately, and not in a workflow of their own. The raw deeds carry the names and
      # addresses of co-owners and managers who hold no public office, and handing them between runners
      # means persisting them — an Actions cache entry survives on GitHub's storage under a restore-keys
      # chain, where the 35-day retention ADR-0033 decision 5 promises cannot reach it. So the deeds
      # live and die inside one job.
      #
      # What DOES cross the boundary is the verdict (ADR-0037): a kind, a role, an entry reference and
      # booleans, keyed on a link whose name is the declaring official's — someone this surface
      # publishes by design. That is strictly less than the CACBG corpus cached a few steps above.
      #
      # The previous split also could not work on its own terms: the crawl job gated on a candidate list
      # only the decision job produced, the decision job refused without a cache only the crawl job
      # produced, and neither persisted its half. Both were permanently green no-ops.
      - name: Emit the candidate ЕИК list for the crawler
        run: node --import ./scripts/cacbg/register-ts.mjs scripts/cacbg/load.mjs --emit-candidates

      # ALWAYS, on every run that reaches here — not conditionally. With the verdict cache restored the
      # crawl is usually cheap (a complete cache costs zero requests), and what it does spend goes on
      # links whose lookup has aged out or whose declaration moved. A run that reaches here with a full
      # cache makes no requests at all; one that starts cold makes as many as its budget allows.
      #
      # Restore the VERDICT cache — booleans, a role and an entry reference per link, and no name of
      # anyone without public office (ADR-0037). That is what makes this restorable at all: the raw
      # deeds it was derived from carry third-party names and are never cached, never uploaded, and
      # deleted the moment the crawler has decided. Without this the crawl restarts at `cached 0` every
      # month and, at 5 requests per window, never finishes (ADR-0036).
      - name: Restore the Trade Register verdict cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/tr/tr-cache.sqlite
          key: tr-verdicts-${{ github.run_id }}
          restore-keys: |
            tr-verdicts-

      # Pace and refusals live in scripts/tr/fetch-deeds.mjs and are not configurable here on purpose:
      # 1 request / 3 s, sequential, a closed candidate set, and a 429 that cools down rather than
      # ending the run (ADR-0036). Spec §3.3 permits a bounded per-ЕИК lookup and forbids bulk
      # scraping; the limiter is the operator's only way to state a rate preference, so we wait it out
      # instead of tuning around it.
      #
      # --links-file, not --eiks-file: the crawler decides each link beside the deed and stores only the
      # verdict, so the deed never has to survive this step (ADR-0037).
      - name: Refresh the Trade Register verdicts
        env:
          MAX_AGE: ${{ inputs.tr_max_age_days || '30' }}
          LIMIT: ${{ inputs.tr_limit }}
          # Leaves room for resolve/audit/ship inside the job's 300-minute ceiling. Spending it is not a
          # failure: whatever was decided is cached, and the next run continues from there.
          MAX_RUNTIME: ${{ inputs.tr_max_runtime_min || '180' }}
        run: |
          set -euo pipefail
          ARGS=(--links-file scratch/cacbg/staging/candidate-links.jsonl \
                --max-age-days "$MAX_AGE" --max-runtime-min "$MAX_RUNTIME")
          [ -n "$LIMIT" ] && ARGS+=(--limit "$LIMIT")
          set +e
          node scripts/tr/fetch-deeds.mjs "${ARGS[@]}"
          code=$?
          set -e
          # Exit 2 now means the block outlasted every cooldown — not that we met one 429. Still not a
          # build failure: the run stopped politely, marked nothing for the ЕИК that hit it, and the
          # partial cache is valid and resumable. Whether a partial cache may PUBLISH is load.mjs's
          # decision, not this step's.
          if [ "$code" -eq 2 ]; then
            echo "::warning::The register blocked us past every cooldown; the crawl stopped and the cache is resumable."
            exit 0
          fi
          exit "$code"

      # Saved on always(): a run cut short by the rate limiter or the runtime budget is exactly the one
      # whose progress must survive, and it is also the one most likely to fail a later step.
      - name: Save the Trade Register verdict cache
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/tr/tr-cache.sqlite
          key: tr-verdicts-${{ github.run_id }}

      - name: Resolve → build domain in a work sqlite (libel gate must pass)
        run: node --import ./scripts/cacbg/register-ts.mjs scripts/cacbg/load.mjs

      # The raw deeds are third-party personal data and exist only to produce booleans. They are deleted
      # with the runner regardless; deleting them explicitly means a failure AFTER this point cannot
      # leave them sitting in a job artifact or a debug upload someone adds later.
      - name: Delete the raw deeds
        if: always()
        run: rm -rf scratch/tr/deeds

      - name: Audit published links (fails the run on any libel-invariant violation)
        run: node --import ./scripts/cacbg/register-ts.mjs scripts/cacbg/audit.mjs

      - name: Apply the свързани-лица schema to the target D1
        # The base schema is created out-of-band via `d1 execute --file` (import.mjs), so wrangler's
        # migration tracking is empty and `d1 migrations apply` would re-run 0000 and collide. Apply 0002
        # directly the same way; it is idempotent (CREATE … IF NOT EXISTS). Render first for the real
        # database_id + name (committed config holds placeholders) — same as the deploy path.
        run: |
          node scripts/wrangler-render.mjs apps/web/wrangler.jsonc
          pnpm --filter @sigma/web exec wrangler d1 execute "$SIGMA_D1_NAME" \
            --config wrangler.deploy.jsonc --remote --yes \
            --file ../../packages/db/migrations/0003_related_persons_foundation.sql
          # 0006 attaches the Trade Register evidence seal (#279, ADR-0033). Both migrations are
          # applied by name here because wrangler's migration ledger is empty on this D1 (the base
          # schema was created out-of-band), so `d1 migrations apply` would collide on 0000.
          pnpm --filter @sigma/web exec wrangler d1 execute "$SIGMA_D1_NAME" \
            --config wrangler.deploy.jsonc --remote --yes \
            --file ../../packages/db/migrations/0009_interest_link_evidence.sql
          # 0007 retrofits the publishing-gate CHECK constraints and control_hash NOT NULL onto an
          # ALREADY-PROVISIONED D1 (#279 §2). 0003 declares them now, but `CREATE TABLE IF NOT EXISTS`
          # never revisits an existing table and the ship step wipes ROWS, not definitions — so without
          # this a live database keeps the unconstrained shape no matter how often the data reloads.
          # Rebuild-based and therefore idempotent: re-applying copies an already-constrained table.
          pnpm --filter @sigma/web exec wrangler d1 execute "$SIGMA_D1_NAME" \
            --config wrangler.deploy.jsonc --remote --yes \
            --file ../../packages/db/migrations/0010_publishing_gate_constraints.sql

      - name: Ship свързани-лица tables → D1
        # ship-related-persons.mjs shells out to `wrangler d1 execute` with cwd=apps/web. Two things it
        # needs that a bare `node …` invocation lacks: (1) wrangler on PATH (the other steps get it via
        # `pnpm … exec`), and (2) an auto-loaded config carrying the real database_id + target name — the
        # committed apps/web/wrangler.jsonc holds a zero-UUID placeholder + base name 'sigma'. Render the
        # real values and overwrite the auto-loaded config, then add the workspace bin to PATH. ship writes
        # ONLY свързани-лица tables (its TABLES list), so the EOP corpus is untouched.
        run: |
          set -euo pipefail
          node scripts/wrangler-render.mjs apps/web/wrangler.jsonc
          cp apps/web/wrangler.deploy.jsonc apps/web/wrangler.jsonc
          export PATH="$GITHUB_WORKSPACE/apps/web/node_modules/.bin:$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          # --min-links is passed EXPLICITLY, not left at its default of 50. Under #279 the surface is
          # measured at ~329 links, so 50 no longer protects anything: a partially-restored Trade
          # Register cache yields roughly 80 published links, which clears a floor of 50, ships a
          # decimated surface and wipes the rest. The loader's coverage gate is the first defence and
          # this is the second (ADR-0033 decision 7). Lower it deliberately, in a PR, if a genuinely
          # smaller surface is ever expected.
          node scripts/ship-related-persons.mjs --work-db data/work/backfill.sqlite --remote --yes \
            --min-links 250

      - name: Reindex search projection → officials searchable (same batch the cron runs)
        # ship writes ONLY the свързани-лица domain tables (interest_links, persons, …), NOT search_index.
        # search_index.official is derived from interest_links by refresh-slice's `entity-search-index`
        # batch, which in steady state only the sigma-etl cron runs (0 */6). Without this step a dispatch
        # seeds the data but leaves officials UNSEARCHABLE until the next cron — the workflow would not
        # actually "ship into a served D1" as titled. Emit that batch from the SAME parser the Worker uses
        # (scripts/emit-refresh-group.mjs → packages/ingest refreshSliceStatementGroups; no SQL duplicated)
        # and run it against the target D1. Idempotent: each kind is DELETE+reINSERT, so re-runs converge.
        run: |
          set -euo pipefail
          mkdir -p data/work
          node --import ./scripts/cacbg/register-ts.mjs scripts/emit-refresh-group.mjs entity-search-index \
            > "$GITHUB_WORKSPACE/data/work/reindex.sql"
          pnpm --filter @sigma/web exec wrangler d1 execute "$SIGMA_D1_NAME" \
            --config wrangler.deploy.jsonc --remote --yes \
            --file "$GITHUB_WORKSPACE/data/work/reindex.sql"
