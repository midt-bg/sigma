name: Related-persons data foundation (build + ship)

# Existing weekly schedule remains active until an explicitly approved Container cutover.
# This workflow and the Container share scripts/related-persons-job.mjs. A stamped cache can be
# rebuilt without crawling here; the Container discovers changes before each build.
# Credentials remain scoped to the selected GitHub Environment.

on:
  # Keep the existing weekly writer until the separately approved Container cutover.
  # Scheduled runs rebuild the stamped cache; a requested or healing crawl refreshes it.
  schedule:
    # 03:00 UTC on Mondays.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: Target D1 environment
        type: choice
        # No `dev` environment exists — every fallback in this file is `|| 'staging'` and the note above
        # says the job targets staging. A `dev` default sent a manual dispatch to an environment with no
        # secrets, so it failed at the credential guard rather than running where it was meant to.
        options: [staging, production]
        default: staging
      full_crawl:
        description: Crawl the CACBG corpus (slow). RESUMES from the cached raw XML — fetch.mjs skips files already on disk, so this fills gaps rather than re-fetching from scratch (clear the cache for a true rebuild). Off = extract from the existing raw cache without crawling.
        type: boolean
        default: false

# Least-privilege: this workflow only reads the repo; it authenticates to Cloudflare with a scoped token.
permissions:
  contents: read

concurrency:
  # Never let two data-foundation runs overlap, and deliberately NOT keyed on the environment. Two
  # writes to different D1 slots cannot collide, but both may crawl the SAME public register of
  # declarations — a staging and a production run in parallel would double the request rate against it.
  # The shared resource is the register, so the group is global. Never cancel one in flight: a killed run
  # loses whatever the crawl had not yet committed.
  group: related-persons-data
  cancel-in-progress: false

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    # A from-scratch corpus crawl of the whole register of declarations is the long pole (all
    # year-folders, politely throttled) and must fit in ONE job with extract/resolve/decide/audit/ship
    # after it — 120 was too tight and timed out mid-crawl. 300 leaves headroom under GitHub's 6-hour hard
    # cap. A run past this is wedged (stalled gov-server I/O) — fail rather than burn the slot. The raw
    # corpus is cached (below) so a re-run resumes instead of re-crawling from scratch.
    timeout-minutes: 300
    environment: ${{ inputs.environment || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGMA_D1_ID: ${{ secrets.SIGMA_D1_ID }}
      SIGMA_D1_NAME: ${{ vars.SIGMA_D1_NAME }}
      # The DECLARED intended environment — the independent anchor the ship guard checks the (name, id) pair
      # against (T48), so a consistent-but-wrong pair can't wipe the wrong DB. See assertD1TargetAuthorized.
      SIGMA_SHIP_ENV: ${{ inputs.environment || 'staging' }}
      # Suppression (takedown) list keying — load.mjs fingerprints link-suppressions.jsonl under this salt and
      # refuses to build if the list is non-empty but the salt is unset (fail-closed, ADR-0031). Without this
      # the first suppression entry would break every ship; the key version guards a coordinated salt rotation.
      SUPPRESSION_SALT: ${{ secrets.SUPPRESSION_SALT }}
      SUPPRESSION_KEY_VERSION: ${{ vars.SUPPRESSION_KEY_VERSION || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # node:sqlite (DatabaseSync) + native TS type-stripping, no flags
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Guard — require Cloudflare credentials
        run: |
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "${SIGMA_D1_ID}" ]          && missing+=("SIGMA_D1_ID")
          [ -z "${SIGMA_D1_NAME}" ]        && missing+=("SIGMA_D1_NAME (var)")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repo/environment secrets: ${missing[*]} — cannot ship."
            exit 1
          fi

      # Positive name allowlist by environment (allowlist-over-denylist, ADR-0031). This workflow wipes+reloads
      # the свързани-лица tables, so a wrong target is destructive: production MUST name a prod blue-green slot
      # (sigma-blue|sigma-green — deploy.md „production" row), and dev/staging MUST NOT. (The exact non-prod names
      # live in each Environment's SIGMA_D1_NAME var; the ship step additionally requires SIGMA_SHIP_ENV to match
      # and PROVES the name↔SIGMA_D1_ID pair against Cloudflare before deleting — assertD1TargetAuthorized.)
      # The slot set is kept in lockstep with PRODUCTION_SLOTS in scripts/ship-related-persons.mjs (#226).
      # $SIGMA_SHIP_ENV, never `${{ inputs.environment }}` inline. `type: choice` is enforced by the UI
      # only — a POST to .../dispatches can pass an arbitrary string, which an inline expression pastes
      # into the shell before `[` ever evaluates it. This block is also the one that decides whether the
      # production guard fires, so a crafted value could both inject and walk past the guard it was
      # meant to trip. The env binding above passes the same value as data, where it cannot be code.
      - name: Guard — SIGMA_D1_NAME matches the environment
        run: |
          case "${SIGMA_D1_NAME}" in
            sigma-blue|sigma-green) IS_PROD_SLOT=1 ;;
            *) IS_PROD_SLOT=0 ;;
          esac
          if [ "${SIGMA_SHIP_ENV}" = "production" ]; then
            if [ "$IS_PROD_SLOT" != "1" ]; then
              echo "::error::production requires SIGMA_D1_NAME to be a prod slot (sigma-blue|sigma-green), got '${SIGMA_D1_NAME}' — refusing to ship."
              exit 1
            fi
          else
            if [ "$IS_PROD_SLOT" = "1" ]; then
              echo "::error::SIGMA_D1_NAME='${SIGMA_D1_NAME}' (a PRODUCTION slot) on a '${SIGMA_SHIP_ENV}' run — a rebuild would WIPE prod. Set a non-production SIGMA_D1_NAME variable for this Environment."
              exit 1
            fi
          fi

      # Persist the raw XML corpus across runs. fetch.mjs writes to scratch/cacbg/raw/ and skips files
      # already on disk (source is immutable per year), so restoring a prior snapshot lets a re-run resume
      # instead of re-crawling from 2015 — and makes full_crawl=false ("extract from existing raw cache")
      # meaningful. Each run saves under a unique key; restore-keys pulls the most recent snapshot.
      # (Cross-run only — durable incremental persistence is the sigma-etl Worker's R2 job per ADR-0006.
      # GitHub's 10 GB repo cache is the ceiling here.)
      #
      # The key carries run_attempt, not just run_id, because run_id is STABLE across a re-run — that is what
      # run_attempt exists for — and a cache entry is immutable once written. Keyed on run_id alone, „Re-run
      # failed jobs" (the natural response to a deadline stop, and what this file's own comments invite)
      # restores attempt 1's snapshot, crawls for hours, then tries to save onto attempt 1's key: refused,
      # downgraded to a warning, step green. The verify step below would then look up that same key, find
      # attempt 1's entry, and certify the loss as a success. Every extra hour crawled would vanish.
      - name: Restore raw CACBG corpus cache
        id: corpus_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/cacbg/raw
          key: cacbg-raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cacbg-raw-

      # Does the restored cache carry a completeness stamp? fetch.mjs writes it only on a corpus that
      # reconciled against the register's own list.xml, and clears it before touching anything — so its
      # absence means a deadline stop, a crash, or a cache saved before the stamp existed at all. The
      # crawl below consults this so an unstamped cache HEALS instead of failing extract: a resume over a
      # complete cache is ~2 minutes (declarations on disk are skipped) and re-verifies against the live
      # register — the authoritative source — rather than trusting whatever the cache holds.
      - name: Check the corpus completeness stamp
        id: corpus_stamp
        run: |
          # The restore action extracts straight into the workspace and downgrades tar errors to a
          # warning — a failed extraction can leave SOME files (the stamp included) with no matched key
          # reported (review finding). Files from an extraction the cache service never acknowledged are
          # debris, not a corpus: the stamp among them would certify XML files that half-exist. Discard
          # the whole tree so the state is exactly "no cache", which the healing crawl below handles.
          if [ -z "${{ steps.corpus_restore.outputs.cache-matched-key }}" ] && [ -d scratch/cacbg/raw ]; then
            echo "restore reported no matched key but scratch/cacbg/raw exists — discarding debris"
            rm -rf scratch/cacbg/raw
          fi
          if [ -f scratch/cacbg/raw/.corpus-complete.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "stamped corpus: $(cat scratch/cacbg/raw/.corpus-complete.json)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no completeness stamp — the crawl will run to verify and stamp the corpus"
          fi

      # Crawl only on demand. The polite full crawl of register.cacbg.bg is long; Container refresh is enabled separately after acceptance.
      #
      # --deadline-minutes is 60 under the job's 300-minute cap, and the margin is the point. The corpus
      # (~37 sets / ~281 000 declarations) does not fit in one job: run 31889519937 crawled 36 sets in the
      # full 300 and was killed inside the 37th. A killed crawl keeps writing after the step dies, so the
      # `always()` save below ran tar over a moving tree, failed with „file changed as we read it", and —
      # because actions/cache/save downgrades a save failure to a warning — reported success having stored
      # nothing. Stopping ourselves at 240 leaves the tree quiet before the axe falls.
      #
      # The margin is 60 minutes MINUS what the deadline cannot see. fetch.mjs starts its own clock when it
      # starts, so checkout, pnpm/Node setup, install, the guards and the cache restore all come out of the
      # 300 before minute 0; the stop itself can overshoot by one politeGet chain (5 tries × a 30 s
      # inactivity timeout plus backoff, concurrent across workers, so ~3 min not 8×3); and on a run that
      # does NOT deadline, everything downstream — extract over ~281k files, the D1 exports, the decision
      # pass, resolve, audit, migrations, ship, reindex — has to fit in the same hour. Tar
      # itself is the least of it (~3 GB in an hour is under 1 MiB/s). Treat 60 as adequate but not roomy:
      # if the downstream steps grow, lower the deadline rather than raising the cap.
      #
      # The crawl exits non-zero on a deadline stop (the corpus IS partial) and the cache carries what it
      # fetched, so the next run resumes rather than restarting. Budget two runs for a cold corpus, one
      # thereafter. Either „Re-run failed jobs" or a fresh dispatch resumes: the key carries run_attempt,
      # which a re-run increments, so the save lands on a new key while restore-keys still finds the old one.
      # `full_crawl || stamp missing`: an explicitly requested crawl, or the self-heal. On a scheduled run
      # inputs.full_crawl is empty (false), so steady state with a stamped cache stays zero-network — the
      # heal only fires on a cache that was never confirmed whole, where trusting it would be the bug.
      - name: Crawl CACBG (full corpus)
        if: ${{ inputs.full_crawl || steps.corpus_stamp.outputs.present != 'true' }}
        run: node scripts/cacbg/fetch.mjs --concurrency 8 --deadline-minutes 240

      # Save the (possibly extended) corpus whenever we crawled — even if a later step fails — so the next
      # run resumes from here. Skipped only when the crawl itself was skipped (stamped cache, no
      # full_crawl): nothing new was fetched. A scheduled run that self-healed DOES save — that crawl is
      # real work and the stamp it wrote must reach the cache, or every Monday heals again.
      - name: Save raw CACBG corpus cache
        if: ${{ always() && (inputs.full_crawl || steps.corpus_stamp.outputs.present != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/cacbg/raw
          key: cacbg-raw-${{ github.run_id }}-${{ github.run_attempt }}

      # The step above CANNOT fail: actions/cache/save turns any upload/tar error into a warning and exits 0,
      # so a green „Save raw CACBG corpus cache" is not evidence that anything was stored — in run
      # 31889519937 it was green and the cache was empty, which is how five hours of crawling went missing
      # unnoticed. Ask the cache service whether the key actually exists; lookup-only downloads nothing.
      - name: Verify the corpus cache was really written
        if: ${{ always() && (inputs.full_crawl || steps.corpus_stamp.outputs.present != 'true') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/cacbg/raw
          key: cacbg-raw-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true

      # Shared pipeline: hydrate EOP + registry before extraction, then load, bridge, audit and atomic ship.
      - name: Build and publish the verified related-persons snapshot
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          node --import ./scripts/cacbg/register-ts.mjs scripts/related-persons-job.mjs --remote --yes --skip-fetch
